# Meldet nach jeder Änderung an der Homepage alle Seiten an Bing (und andere Suchmaschinen mit IndexNow).
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warten, bis GitHub Pages die neue Version ausliefert
        run: sleep 90
      - name: Seiten an IndexNow melden
        run: |
          curl -sS -o /dev/null -w "IndexNow Antwort: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"oddbeangames.de","key":"6fffa7f01d64b185c11adc51ee837fb3","keyLocation":"https://oddbeangames.de/6fffa7f01d64b185c11adc51ee837fb3.txt","urlList":["https://oddbeangames.de/","https://oddbeangames.de/impressum/","https://oddbeangames.de/datenschutz/","https://oddbeangames.de/kontakt/","https://oddbeangames.de/en/","https://oddbeangames.de/en/legal-notice/","https://oddbeangames.de/en/privacy/","https://oddbeangames.de/en/contact/"]}'
